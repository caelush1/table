<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="loginpage">
        <h1>Login</h1>
        <form id="loginForm">
            <div class="inputbox">
                <input type="text" id="user" class="input-field" placeholder="Username" required>
            </div>
            <div class="inputbox">
                <input type="password" id="pass" class="input-field" placeholder="Password" required>
            </div>
            <div class="remember-forget">
                <label for=""><input type="checkbox" /> Remember me</label>
                <a href="" class="forget">Forget password</a>
            </div>
            <button type="button" id="button">Login</button>
            <div class="register">
                <p>No account? <a href="">Register here</a></p>
            </div>
        </form>

        <script>
            // Function to handle login
            function login() {
                const userName = document.getElementById('user').value;
                const userPassword = document.getElementById('pass').value;

                if (userName === 'as' && userPassword === '123') {
                    alert("Welcome");
                    console.log("Welcome");
                    // Redirect to the welcome page
                    window.location.href = "home.html"; // Change this to your desired page
                } else {
                    alert("Invalid username or password");
                    console.log("Invalid username or password");
                }
            }

            // Adding event listener to the button
            document.getElementById('button').addEventListener('click', login);
        </script>
    </div>
</body>
</html>
